[workspace]
resolver = "3"
members = [
  "apps/server"
]

[workspace.dependencies]
anyhow = "1.0.103"
argon2 = { version = "=0.5.3", features = ["std", "zeroize"] }
askama = { version = "0.16.0", default-features = false, features = [
  "config",
  "std",
  "derive",
] }
axum = { version = "0.8.9", features = ["http2", "tracing"] }
fake = { version = "5.1.0" }
nanoid = "0.5.0"
datastar = { version = "0.3.1", features = ["axum", "http2", "tracing"] }
http-body-util = "0.1.3"
rand = "=0.10.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "postgres",
  "json",
  "time",
  "uuid",
  "sqlx-toml",
] }
thiserror = "2.0.19"
time = { version = "0.3.45", features = ["macros", "serde"] }
tokio = { version = "1.52.3", features = [
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "time",
] }
tokio-stream = "0.1.19"
tower = { version = "0.5.3", features = ["make", "util"] }
tower-http = { version = "0.7.0", features = [
  "compression-br",
  "compression-gzip",
  "fs",
  "normalize-path",
  "request-id",
  "timeout",
  "trace",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "=2.5.8"
uuid = { version = "1.24.0", features = ["fast-rng", "v7", "serde"] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
# DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
